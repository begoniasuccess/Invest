<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invest Dashboard｜融資維持率</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='/app.css') }}?v=20261113-journal" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="{{ url_for('static', path='/navigation.js') }}?v=20261114-research-lab"></script>
</head>
<body data-page="margin-maintenance">
  <header class="mobile-nav-bar"><button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-label="開啟選單"><i class="bi bi-list"></i></button><a class="mobile-brand" href="/"><span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span><span>Yu Invest</span></a></header>
  <div class="app-layout">
    <aside id="appSidebar" class="sidebar flex-column">
      <div class="brand"><a class="brand-home" href="/"><span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span><span class="brand-text">Yu Invest</span></a><button id="sidebarCollapseBtn" class="sidebar-collapse-btn" type="button" aria-label="收合側欄"><i class="bi bi-layout-sidebar-inset"></i></button></div>
      <div class="sidebar-label">台股</div><nav id="sidebarNav" class="sidebar-nav"></nav><div class="sidebar-spacer"></div><div class="sidebar-foot"><span class="status-dot"></span>本機資料庫</div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <main class="main-content">
      <header class="topbar">
        <div><div class="eyebrow">MARGIN MAINTENANCE</div><h1>大盤融資維持率</h1><p>同步檢視加權指數、融資維持率與市場資券餘額</p></div>
        <div class="topbar-actions"><span id="sourceBadge" class="source-badge"><i class="bi bi-database-check"></i> 讀取中</span></div>
      </header>

      <section class="filter-panel panel-card">
        <div class="filter-section"><div class="filter-section-title"><i class="bi bi-calendar-range"></i>顯示區間</div>
          <div class="margin-filter-grid">
            <div><label for="startDate">開始日期</label><input id="startDate" type="date" class="form-control" value="{{ default_start_date }}"></div>
            <div><label for="endDate">結束日期</label><input id="endDate" type="date" class="form-control" value="{{ default_end_date }}"></div>
            <div class="filter-actions"><button id="refreshBtn" class="btn btn-dark"><i class="bi bi-arrow-clockwise me-2"></i>重新整理</button></div>
          </div>
        </div>
      </section>

      <div id="alertBox" class="alert app-alert d-none" role="alert"></div>
      <section id="marginSummary" class="summary-grid margin-summary" aria-live="polite"></section>

      <article class="panel-card chart-card margin-chart-card">
        <div class="panel-heading"><div><span class="panel-kicker">MARKET OVERVIEW</span><h2>資券行情走勢</h2></div><small id="chartHint" class="text-secondary"></small></div>
        <div id="marginChart" class="margin-chart"></div>
      </article>

      <article class="panel-card table-card margin-table-card">
        <div class="panel-heading"><div><span class="panel-kicker">RAW DATA</span><h2>原始資料</h2></div><small id="tableCount" class="text-secondary"></small></div>
        <div class="table-wrap margin-table-wrap"><table id="marginTable" class="table align-middle mb-0"><thead></thead><tbody></tbody></table></div>
      </article>
    </main>
  </div>
  <div id="loadingOverlay" class="loading-overlay d-none"><div class="loading-card"><div class="spinner-border text-primary"></div><div>正在讀取融資維持率資料…</div></div></div>
  <script src="{{ url_for('static', path='/margin_maintenance.js') }}?v=20261110-1"></script>
</body>
</html>
