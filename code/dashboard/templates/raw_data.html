<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invest Dashboard｜原始資料</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}?v=20260815-1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='/app.css') }}?v=20260826-3" rel="stylesheet">
  <script src="{{ url_for('static', path='/navigation.js') }}?v=20260819-1"></script>
</head>
<body data-page="raw-data">
  <header class="mobile-nav-bar"><button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-label="開啟選單"><i class="bi bi-list"></i></button><a class="mobile-brand" href="/"><span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span><span>Yu Invest</span></a></header>
  <div class="app-layout">
    <aside id="appSidebar" class="sidebar flex-column">
      <div class="brand"><a class="brand-home" href="/"><span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span><span class="brand-text">Yu Invest</span></a><button id="sidebarCollapseBtn" class="sidebar-collapse-btn" type="button" aria-label="收合側欄"><i class="bi bi-layout-sidebar-inset"></i></button></div>
      <div class="sidebar-label">分析工具</div>
      <nav id="sidebarNav" class="sidebar-nav"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot"><span class="status-dot"></span>本機資料庫</div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <main class="main-content">
      <header class="topbar">
        <div><div class="eyebrow">REPORT DATA</div><h1>原始資料</h1><p>瀏覽完整報表，並從網頁完成每日資料更新</p></div>
        <div class="topbar-actions">
          <span id="updateStatus" class="source-badge"><i class="bi bi-database-check"></i> 待命</span>
          <div class="update-control">
            <button id="updateReportBtn" class="btn btn-primary action-btn"><i class="bi bi-cloud-arrow-down me-2"></i>更新報表</button>
            <details id="reportUpdateMenu" class="update-menu">
              <summary class="update-settings-btn" title="設定報表更新範圍" aria-label="設定報表更新範圍"><i class="bi bi-gear"></i></summary>
              <div class="update-menu-panel">
                <div class="update-menu-title">更新範圍</div>
                <label><input id="updateTaiexReport" class="form-check-input" type="checkbox" checked><span>加權指數報表</span></label>
                <label><input id="updateFuturesReport" class="form-check-input" type="checkbox" checked><span>期貨指數報表</span></label>
                <small>同時執行時固定依加權→期貨。</small>
              </div>
            </details>
          </div>
        </div>
      </header>

      <section class="filter-panel panel-card">
        <div class="filter-section">
          <div class="filter-section-title"><i class="bi bi-sliders"></i>資料條件</div>
          <div class="filter-grid raw-filter-grid">
            <div><label for="reportType">報表</label><select id="reportType" class="form-select">{% for key, config in reports.items() %}<option value="{{ key }}">{{ config.name }}</option>{% endfor %}</select></div>
            <div><label for="pageSize">每頁筆數</label><select id="pageSize" class="form-select">{% for size in page_sizes %}<option value="{{ size }}" {% if size == 30 %}selected{% endif %}>{{ size }} 筆</option>{% endfor %}</select></div>
          </div>
        </div>
        <div class="filter-section filter-section-period">
          <div class="filter-section-title"><i class="bi bi-calendar-range"></i>資料時間範圍</div>
          <div class="filter-grid filter-grid-period">
            <div><label for="periodMode">區間模式</label><select id="periodMode" class="form-select"><option value="date">指定日期</option><option value="year">選擇年份</option></select></div>
            <div id="startDateField"><label for="startDate">開始日期</label><input id="startDate" type="date" class="form-control"></div>
            <div id="endDateField"><label for="endDate">結束日期</label><input id="endDate" type="date" class="form-control" value="{{ default_end_date }}"></div>
            <div id="startYearField" class="d-none"><label for="startYear">起始年份</label><select id="startYear" class="form-select"></select></div>
            <div id="endYearField" class="d-none"><label for="endYear">結束年份</label><select id="endYear" class="form-select"></select></div>
            <div class="filter-actions"><button id="refreshBtn" class="btn btn-dark"><i class="bi bi-arrow-clockwise me-2"></i>重新整理</button></div>
          </div>
        </div>
      </section>

      <div id="alertBox" class="alert app-alert d-none" role="alert"></div>

      <article id="rawTablePanel" class="panel-card table-card expandable-panel raw-table-card">
        <div class="panel-heading">
          <div><span class="panel-kicker">REPORT TABLE</span><h2 id="tableTitle">報表資料</h2></div>
          <div class="panel-actions">
            <button id="copyTableBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-clipboard me-2"></i>複製表格</button>
            <button id="columnBtn" class="btn btn-outline-secondary btn-sm" data-bs-toggle="offcanvas" data-bs-target="#columnCanvas"><i class="bi bi-layout-three-columns me-2"></i>顯示欄位</button>
            <button id="downloadBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-download me-2"></i>下載目前欄位</button>
            <button id="tableExpandBtn" class="icon-btn expand-btn" title="放大表格"><i class="bi bi-arrows-fullscreen"></i></button>
          </div>
        </div>
        <div class="raw-table-tools">
          <div class="raw-column-search">
            <select id="searchColumn" class="form-select form-select-sm" aria-label="搜尋欄位"></select>
            <input id="tableSearch" class="form-control form-control-sm" type="search" placeholder="輸入欄位關鍵字">
            <button id="searchBtn" class="btn btn-sm btn-primary" type="button"><i class="bi bi-search me-1"></i>搜尋</button>
            <button id="clearSearchBtn" class="btn btn-sm btn-outline-secondary" type="button">清除</button>
          </div>
          <small class="raw-sort-hint"><i class="bi bi-arrow-down-up me-1"></i>點擊欄位名稱可排序</small>
        </div>
        <div class="raw-table-meta"><span id="rowSummary">讀取中</span><div class="pagination-actions"><button id="prevBtn" class="btn btn-sm btn-outline-secondary"><i class="bi bi-chevron-left"></i> 上一頁</button><span id="pageLabel">第 1 頁</span><button id="nextBtn" class="btn btn-sm btn-outline-secondary">下一頁 <i class="bi bi-chevron-right"></i></button></div></div>
        <div class="table-wrap raw-table-wrap"><table id="rawTable" class="table align-middle mb-0"><thead></thead><tbody></tbody></table></div>
      </article>
    </main>
  </div>

  <div class="offcanvas offcanvas-end column-canvas" tabindex="-1" id="columnCanvas">
    <div class="offcanvas-header"><div><div class="panel-kicker">COLUMN SETTINGS</div><h5 class="offcanvas-title">顯示欄位</h5></div><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body">
      <input id="columnSearch" class="form-control mb-3" type="search" placeholder="搜尋欄位名稱">
      <div class="column-actions mb-3"><button id="selectAllBtn" class="btn btn-sm btn-outline-primary">全選</button><button id="clearAllBtn" class="btn btn-sm btn-outline-secondary">全不選</button><button id="resetColumnsBtn" class="btn btn-sm btn-outline-secondary">恢復預設</button></div>
      <div id="columnList" class="column-list"></div>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay d-none"><div class="loading-card"><div class="spinner-border text-primary"></div><div id="loadingText">正在讀取報表…</div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', path='/raw_data.js') }}?v=20261023-turnover-order-fix"></script>
</body>
</html>
