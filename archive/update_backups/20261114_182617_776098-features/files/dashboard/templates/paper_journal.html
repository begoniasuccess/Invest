<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invest Dashboard｜交易日記</title>
<link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="{{ url_for('static', path='/app.css') }}?v=20261113-journal" rel="stylesheet"><link href="{{ url_for('static', path='/paper_trade.css') }}?v=1" rel="stylesheet"><script src="{{ url_for('static', path='/navigation.js') }}?v=20261113-journal"></script></head>
<body data-page="paper-journal"><header class="mobile-nav-bar"><button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-label="開啟選單"><i class="bi bi-list"></i></button><a class="mobile-brand" href="/"><span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span><span>Yu Invest</span></a></header>
<div class="app-layout"><aside id="appSidebar" class="sidebar flex-column"><div class="brand"><a class="brand-home" href="/"><span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span><span class="brand-text">Yu Invest</span></a><button id="sidebarCollapseBtn" class="sidebar-collapse-btn" type="button" aria-label="收合側欄"><i class="bi bi-layout-sidebar-inset"></i></button></div><div class="sidebar-label">台股</div><nav id="sidebarNav" class="sidebar-nav"></nav><div class="sidebar-spacer"></div><div class="sidebar-foot"><span class="status-dot"></span>本機資料庫</div></aside><div id="sidebarBackdrop" class="sidebar-backdrop"></div>
<main class="main-content"><header class="topbar"><div><div class="eyebrow">TRADING JOURNAL</div><h1>交易日記</h1><p>獨立 Markdown 日記｜連結日期、帳號、場次及逐筆交易</p></div><a href="/replay" class="btn btn-outline-primary">回到行情回放</a></header>
<div id="journalMsg" class="alert alert-info" role="status">載入中…</div>
<section class="panel-card paper-section mb-3"><div class="d-flex justify-content-between align-items-center"><h2>日記查詢</h2><button id="dNew" class="btn btn-primary" type="button">＋ 新增日記</button></div><form id="dSearch"><div class="paper-fields">
<div><label for="dAccount">關聯帳號</label><select id="dAccount" class="form-select"></select></div><div><label for="dRun">關聯場次</label><select id="dRun" class="form-select"></select></div><div><label for="dTrade">關聯交易</label><select id="dTrade" class="form-select"></select></div><div><label for="dHistory">關聯歷史日期</label><input id="dHistory" type="date" class="form-control"></div>
<div><label for="dStart">日記起日</label><input id="dStart" type="date" class="form-control"></div><div><label for="dEnd">日記迄日</label><input id="dEnd" type="date" class="form-control"></div><div class="paper-wide"><label for="dKeyword">標題／內文關鍵字</label><input id="dKeyword" class="form-control" maxlength="200"></div><div class="paper-action"><button class="btn btn-primary" type="submit">查詢</button> <button id="dClear" type="button" class="btn btn-outline-secondary">清除</button></div></div></form><p class="paper-muted mt-2 mb-0">帳號及場次篩選亦包含其下的交易連結；歷史日期依直接日期連結、場次開始日或交易進場日比對。日記日期可獨立設定。</p></section>
<section id="dEditor" class="panel-card paper-section mb-3" hidden><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><h2 id="dEditHeading">新增日記</h2><button id="dCancel" class="btn btn-outline-secondary btn-sm" type="button">關閉編輯</button></div><form id="dForm"><div class="row g-2 mb-3"><div class="col-md-8"><label for="dTitle" class="form-label">標題</label><input id="dTitle" class="form-control" required maxlength="200"></div><div class="col-md-4"><label for="dDate" class="form-label">日記日期</label><input id="dDate" type="date" class="form-control" required></div></div>
<div class="d-flex gap-2 flex-wrap mb-2"><button type="button" id="dWrite" class="btn btn-sm btn-primary">Markdown 編輯</button><button type="button" id="dPreview" class="btn btn-sm btn-outline-primary">預覽</button></div><div class="border rounded p-2 mb-2" id="mediaPanel">
<div class="d-flex flex-wrap gap-2 align-items-center"><label for="mediaUpload" class="form-label mb-0">本機檔案</label><input id="mediaUpload" type="file" multiple class="form-control form-control-sm" accept=".png,.jpg,.jpeg,.gif,.webp,.avif,.bmp,.mp4,.webm,.ogg,.ogv,.mov,.pdf,.txt,.csv,.zip" style="max-width:420px"><button id="mediaUploadBtn" type="button" class="btn btn-sm btn-outline-primary">上傳並插入</button><button id="mediaLibraryBtn" type="button" class="btn btn-sm btn-outline-secondary" aria-expanded="false">專案檔案庫</button></div>
<div id="mediaStatus" class="small text-secondary mt-1" role="status">單檔最多 500 MB；圖片、影片及附件可重複引用。</div>
<div id="mediaLibrary" hidden class="mt-2"><div class="d-flex flex-wrap gap-2 mb-2"><input id="mediaSearch" type="search" placeholder="搜尋檔名" class="form-control form-control-sm" style="max-width:260px"><select id="mediaKind" class="form-select form-select-sm" style="max-width:150px"><option value="all">全部檔案</option><option value="image">圖片</option><option value="video">影片</option><option value="file">附件</option></select><button id="mediaRefresh" type="button" class="btn btn-sm btn-outline-secondary">重新整理</button></div><div id="mediaFiles" class="d-grid gap-2" style="max-height:320px;overflow:auto"></div></div></div>
<textarea id="dBody" class="form-control font-monospace mb-2" rows="16" maxlength="100000" placeholder="# 盤前規劃&#10;&#10;- 進場條件&#10;- 交易心得"></textarea><article id="dRendered" class="journal-preview border rounded p-3 mb-2" hidden></article><p class="paper-muted">支援標題、粗體、斜體、清單、引用、程式碼、表格、連結與 Markdown 圖片網址；本機影片可於預覽播放，其他附件可下載。不執行原始 HTML。</p>
<h3 class="fs-6 mt-3">關聯紀錄（可選多筆，跨帳號）</h3><div id="dLinks" class="d-grid gap-2 mb-3"></div><div class="paper-fields"><div><label for="lKind">連結類型</label><select id="lKind" class="form-select"><option value="date">歷史日期</option><option value="account">帳號</option><option value="run">交易場次</option><option value="trade">逐筆交易</option></select></div><div id="lDateWrap"><label for="lDate">歷史日期</label><input id="lDate" type="date" class="form-control"></div><div id="lAccountWrap" hidden><label for="lAccount">帳號</label><select id="lAccount" class="form-select"></select></div><div id="lRunWrap" hidden><label for="lRun">場次</label><select id="lRun" class="form-select"></select></div><div id="lTradeWrap" hidden><label for="lTrade">交易</label><select id="lTrade" class="form-select"></select></div><div class="paper-action"><button id="lAdd" type="button" class="btn btn-outline-primary">＋ 加入連結</button></div></div>
<div class="d-flex gap-2 justify-content-end mt-3"><button id="dDelete" type="button" class="btn btn-outline-danger" hidden>刪除日記</button><button id="dSave" class="btn btn-primary" type="submit">儲存日記</button></div></form></section>
<section class="panel-card paper-section"><div class="d-flex justify-content-between align-items-center mb-3"><h2>日記列表</h2><div class="d-flex gap-2"><button id="dPrev" class="btn btn-outline-secondary btn-sm">上一頁</button><button id="dNext" class="btn btn-outline-secondary btn-sm">下一頁</button></div></div><div id="dResults" class="d-grid gap-3"></div></section></main></div><style>.journal-preview{overflow-wrap:anywhere;min-height:120px}.journal-preview img,.journal-preview video{max-width:100%;height:auto}.journal-preview video{display:block;max-height:70vh}.journal-preview table{border-collapse:collapse;width:100%;display:block;overflow:auto}.journal-preview td,.journal-preview th{border:1px solid #d9e0e9;padding:.4rem}.journal-preview pre{background:#f2f5f9;padding:.8rem;overflow:auto}.journal-preview blockquote{border-left:3px solid #a8bad4;padding-left:.8rem;color:#64748b}.journal-link-label{overflow-wrap:anywhere}.paper-fields [hidden]{display:none!important}</style><script src="{{ url_for('static', path='/paper_common.js') }}?v=1"></script><script src="{{ url_for('static', path='/paper_journal.js') }}?v=2-media"></script></body></html>
